services:
  - type: web
    name: lab14-ai20k-agent
    runtime: docker
    rootDir: 06-lab-complete
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: AGENT_API_KEY
        generateValue: true
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: lab14-ai20k-cache
          property: connectionString

  - type: keyvalue
    name: lab14-ai20k-cache
    plan: free
    region: singapore
    ipAllowList: []
    maxmemoryPolicy: noeviction
